<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Garden 🌷</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(180deg, #152d28, #243e32, #172b25);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.glow {
    position: absolute;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: #d9b878;
    filter: blur(120px);
    opacity: .16;
}

.glow.one {
    top: 10%;
    left: -100px;
}

.glow.two {
    bottom: 5%;
    right: -100px;
}

/* MAIN */

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    text-align: center;
}

.label {
    color: #d7c59b;
    letter-spacing: 5px;
    font-size: 10px;
    text-transform: uppercase;
    margin-bottom: 20px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(38px, 10vw, 65px);
    font-weight: 500;
    margin-bottom: 12px;
}

.subtitle {
    color: #c5cfc5;
    font-size: 13px;
    line-height: 1.8;
    max-width: 280px;
}

/* FLOWERS */

.garden {
    display: flex;
    justify-content: center;
    align-items: end;
    gap: 22px;
    height: 240px;
    margin: 30px 0;
}

.flower {
    position: relative;
    width: 65px;
    height: 180px;
    animation: sway 4s ease-in-out infinite alternate;
    transform-origin: bottom center;
}

.flower:nth-child(2) {
    animation-delay: .7s;
    transform: scale(1.2);
}

.flower:nth-child(3) {
    animation-delay: 1.2s;
}

.stem {
    position: absolute;
    width: 3px;
    height: 120px;
    background: linear-gradient(#8bbd83, #426f4d);
    bottom: 0;
    left: 50%;
    border-radius: 10px;
}

.leaf {
    position: absolute;
    width: 25px;
    height: 12px;
    background: #79a875;
    border-radius: 100% 0 100% 0;
    bottom: 65px;
    left: 32px;
    transform: rotate(-25deg);
}

.leaf.left {
    left: 5px;
    transform: rotate(200deg);
    bottom: 90px;
}

.bloom {
    position: absolute;
    width: 65px;
    height: 65px;
    left: 50%;
    top: 5px;
    transform: translateX(-50%);
    animation: bloom 3s ease-in-out infinite alternate;
}

.petal {
    position: absolute;
    width: 27px;
    height: 36px;
    background: #f3b9c7;
    border-radius: 50%;
    left: 19px;
    top: 0;
    transform-origin: 50% 32px;
    box-shadow: 0 0 15px #f3b9c755;
}

.petal:nth-child(2) { transform: rotate(60deg); }
.petal:nth-child(3) { transform: rotate(120deg); }
.petal:nth-child(4) { transform: rotate(180deg); }
.petal:nth-child(5) { transform: rotate(240deg); }
.petal:nth-child(6) { transform: rotate(300deg); }

.center {
    position: absolute;
    width: 17px;
    height: 17px;
    background: #f8df96;
    border-radius: 50%;
    top: 24px;
    left: 24px;
    box-shadow: 0 0 15px #f8df96;
}

.flower:nth-child(2) .petal {
    background: #f7d69e;
}

.flower:nth-child(3) .petal {
    background: #d9b6e9;
}

@keyframes sway {
    from { transform: rotate(-5deg); }
    to { transform: rotate(5deg); }
}

@keyframes bloom {
    from { scale: .95; }
    to { scale: 1.08; }
}

/* MESSAGE */

.message {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-style: italic;
    color: #e9d7b7;
    margin-bottom: 12px;
}

.description {
    color: #bdc9be;
    font-size: 12px;
    line-height: 2;
    max-width: 290px;
}

/* BUTTON */

.music-button {
    margin-top: 30px;
    padding: 14px 27px;
    border: 1px solid #c6b48d;
    border-radius: 50px;
    color: #f1dfb9;
    background: transparent;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
}

.music-button:active {
    transform: scale(.95);
    background: #c6b48d22;
}

.music-status {
    margin-top: 13px;
    color: #aebcaf;
    font-size: 10px;
    letter-spacing: 2px;
}

/* FALLING PETALS */

.falling {
    position: fixed;
    top: -30px;
    z-index: 1;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(600deg);
        opacity: 0;
    }
}

/* FOOTER */

footer {
    margin-top: 45px;
    color: #82988a;
    font-size: 10px;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<main class="container">

    <div class="label">A little place of happiness</div>

    <h1>Little Garden</h1>

    <p class="subtitle">
        A garden full of flowers, little dreams,
        and beautiful things.
    </p>

    <div class="garden">

        <div class="flower">
            <div class="stem"></div>
            <div class="leaf"></div>
            <div class="leaf left"></div>
            <div class="bloom">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>
        </div>

        <div class="flower">
            <div class="stem"></div>
            <div class="leaf"></div>
            <div class="leaf left"></div>
            <div class="bloom">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>
        </div>

        <div class="flower">
            <div class="stem"></div>
            <div class="leaf"></div>
            <div class="leaf left"></div>
            <div class="bloom">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>
        </div>

    </div>

    <div class="message">
        "For someone special."
    </div>

    <p class="description">
        Just like flowers need sunshine to bloom,
        some people make our world a little brighter.
        <br>
        And you are one of them.
    </p>

    <button class="music-button" onclick="toggleMusic()">
        ♫ PLAY OUR SONG
    </button>

    <div class="music-status" id="status">
        A LITTLE MUSIC FOR YOU
    </div>

    <audio id="song" loop>
        <source src="sempurna.mp3" type="audio/mpeg">
    </audio>

    <footer>
        MADE WITH LOVE · LITTLE GARDEN
    </footer>

</main>

<script>

const song = document.getElementById("song");
const button = document.querySelector(".music-button");
const statusText = document.getElementById("status");

let playing = false;

function toggleMusic() {

    if (!playing) {

        song.play().then(() => {
            playing = true;
            button.innerHTML = "♫ PAUSE OUR SONG";
            statusText.innerHTML = "NOW PLAYING · ♡";
        }).catch(() => {
            statusText.innerHTML = "MUSIC COULD NOT BE PLAYED";
        });

    } else {

        song.pause();
        playing = false;
        button.innerHTML = "♫ PLAY OUR SONG";
        statusText.innerHTML = "A LITTLE MUSIC FOR YOU";

    }

}

// FALLING FLOWERS

const petals = ["🌸", "🌷", "✿", "❀"];

function createPetal() {

    const petal = document.createElement("div");

    petal.classList.add("falling");
    petal.innerHTML = petals[
        Math.floor(Math.random() * petals.length)
    ];

    petal.style.left = Math.random() * 100 + "vw";
    petal.style.fontSize = (12 + Math.random() * 12) + "px";
    petal.style.animationDuration = (5 + Math.random() * 7) + "s";
    petal.style.opacity = Math.random() * 0.6 + 0.3;

    document.body.appendChild(petal);

    setTimeout(() => {
        petal.remove();
    }, 12000);

}

setInterval(createPetal, 600);

</script>

</body>
  </html>
